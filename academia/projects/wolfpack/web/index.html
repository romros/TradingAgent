<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wolfpack · Market Watch</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">ALQUÍMIA / WOLFPACK</span><h1>Market watch</h1></div>
      <div class="pulse"><i></i><span id="health">connectant…</span></div>
    </header>
    <section class="metrics" id="metrics"></section>
    <section>
      <div class="section-title"><h2>Avisos reals</h2><span id="updated"></span></div>
      <div class="feed" id="messages"></div>
    </section>
    <section>
      <div class="section-title"><h2>Com serien els futurs avisos</h2><span>SIMULACIÓ</span></div>
      <div class="feed simulations" id="simulations"></div>
    </section>
    <footer>Només observació i paper trading · Cap ordre real autoritzada</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
